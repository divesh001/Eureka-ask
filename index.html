<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eureka - Ignite Your Physics Curiosity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="eureka-header">
        <h1>Eureka</h1>
    </header>

    <!-- Main Stream/Feed Container -->
    <main class="feed-container" id="feed-container">
        <!-- Dynamic Curiosity Cards will be loaded here via JS -->
    </main>

    <!-- Navigation Footer -->
    <footer class="eureka-footer">
        <button class="nav-item active" data-target="home" aria-label="Home">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </button>
        <button class="nav-item" data-target="photos" aria-label="Photos">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            <span>Photos</span>
        </button>
        <button class="nav-item" data-target="camera" aria-label="Camera">
            <svg viewBox="0 0 24 24" class="nav-icon"><circle cx="12" cy="12" r="3.2"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            <span>Camera</span>
        </button>
        <button class="nav-item" data-target="profile" aria-label="Profile">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/></svg>
            <span>Profile</span>
        </button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
